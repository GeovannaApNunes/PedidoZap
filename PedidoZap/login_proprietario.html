<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Proprietario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/login_proprietario.css">
</head>

<body>

    <form>
        <div class="mb-3">
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Usuario">
        </div>
        <div class="mb-3">
            <input type="password" class="form-control" id="exampleInputPassword1"  placeholder="Senha">
        </div>
        <div class="mb-3 form-check">
            <a href="">Esqueci minha senha</a>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>


    <footer>
        <p>&copy; 2026 PedidoZap. Todos os direitos reservados. </p>
    </footer>

</body>

</html>

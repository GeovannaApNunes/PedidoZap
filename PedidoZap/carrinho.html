<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body style="background-color: #f5f5f5;">
    <div class="container py-4" style="max-width: 780px;">

        <!-- BOTÃO VOLTAR -->
        <a href="pagina_inicial.html" class="btn btn-light rounded-circle shadow-sm mb-3">
            <i class="bi bi-arrow-left fs-5"></i>
        </a>

        <!-- TÍTULO -->
        <h1 class="fw-bold mb-4">
            Carrinho
        </h1>

        <!-- PRODUTOS -->
        <div id="carrinho-container"></div>

        <!-- LINHA -->

        <!-- TOTAL -->

            <span id="item-count">
                0 itens selecionados
            </span>

            <span id="total">
                <strong>Total: R$ 0,00</strong>
            </span>

        </div>

        <!-- BOTÕES -->

            <button class="btn btn-danger flex-fill" onclick="removeAll()">

            </button>

            </a>

            © 2026 PedidoZap. Todos os direitos reservados.
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

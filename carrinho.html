<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/carrinho.css">
</head>
<body style="background-color: #f5f5f5;">
    <div class="container py-4" style="max-width: 780px;">

        <!-- BOTÃO VOLTAR -->
        <a href="pagina_inicial.html" class="btn btn-light rounded-circle shadow-sm mb-3">
            <i class="bi bi-arrow-left fs-5"></i>
        </a>

        <!-- TÍTULO -->
        <h1 class="fw-bold mb-4">
            Carrinho
        </h1>

        <!-- PRODUTOS -->
        <div id="carrinho-container"></div>

        <!-- LINHA -->
        <hr class="divider">

        <!-- RESUMO -->
        <div class="resumo-container mb-3">
            <div class="d-flex justify-content-between mb-2">
                <span id="item-count">0 itens selecionados</span>
                <strong id="total">R$ 0,00</strong>
            </div>
            <div class="d-flex justify-content-between mb-3">
                <span>Frete estimado</span>
                <strong id="frete">R$ 5,00</strong>
            </div>
            <div class="d-flex justify-content-between total-final">
                <span class="fw-bold">Total com frete</span>
                <strong id="total-com-frete">R$ 5,00</strong>
            </div>
        </div>

        <!-- BOTÕES -->
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <button id="btn-remove-all" class="btn btn-remover-todos" onclick="removeAll()">
                <i class="bi bi-trash"></i> Remover todos
            </button>
            <a href="pagina_inicial.html" class="btn btn-comprar-mais">
                <i class="bi bi-plus-circle"></i> Comprar mais
            </a>
            <a href="pedido.html" id="btn-proseguir" class="btn btn-proseguir">
                <i class="bi bi-check-circle"></i> Prosseguir
            </a>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="mt-5 pb-3">

        <p class="text-center">
            © 2026 PedidoZap. Todos os direitos reservados.
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="js/carrinho.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/formulario.css">
</head>

<body>
    <div class="page-bg d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="card-pedido container bg-white p-4 rounded shadow" style="max-width: 900px;">

            <!-- TÍTULO -->
            <h2 class="titulo-pedido mb-4">
                Precisamos de apenas algumas informações.
            </h2>

            <!-- PRODUTOS -->
            <div class="mb-4">

                <h4 class="fw-bold mb-3">
                    Seu Pedido
                </h4>

                <div id="lista-pedido"></div>

                <div class="d-flex justify-content-between mt-3">

                    <strong id="quantidade-itens">
                        0 itens
                    </strong>

                    <strong id="total-pedido">
                        Total: R$ 0,00
                    </strong>

                </div>

            </div>

            <hr>

            <!-- FORM -->
            <div class="campo-grupo mb-3">
                <label class="campo-label" for="nome">
                    Nome:
                </label>

                <input type="text" id="nome" class="form-control">
            </div>

            <div class="campo-grupo mb-3">
                <label class="campo-label" for="cep">
                    CEP:
                </label>

                <input type="text" id="cep" class="form-control">
            </div>

            <div class="campo-grupo mb-3">
                <label class="campo-label" for="telefone">
                    Telefone:
                </label>

                <input type="text" id="telefone" class="form-control">
            </div>

            <div class="campo-grupo mb-4">
                <label class="campo-label" for="endereco">
                    Endereço:
                </label>

                <input type="text" id="endereco" class="form-control">
            </div>

            <!-- PAGAMENTO -->
            <p class="pagamento-titulo fw-bold">
                Método de pagamento:
            </p>

            <div class="pagamento-opcoes d-flex flex-column gap-3 mb-4">

                <label class="pagamento-opcao">
                    <input type="radio" name="pagamento" value="pix">

                    <i class="bi bi-patch-check-fill text-success"></i>

                    Pix
                </label>

                <label class="pagamento-opcao">
                    <input type="radio" name="pagamento" value="cartao">

                    <i class="bi bi-credit-card-fill text-primary"></i>

                    Cartão de Crédito
                </label>

                <label class="pagamento-opcao">
                    <input type="radio" name="pagamento" value="avista">

                    <i class="bi bi-cash-coin text-warning"></i>

                    À vista

                    <div id="campoTroco" class="mt-3" style="display: none;">

                        <label class="form-label fw-bold">
                            Troco para quanto?
                        </label>

                        <input type="text" id="troco" class="form-control" placeholder="Ex: 100,00">

                    </div>
                </label>

            </div>

            <!-- BOTÕES -->
            <div class="d-flex gap-3">

                <a href="carrinho.html" class="btn btn-danger w-100">

                    Cancelar

                </a>

                <button id="botaoProsseguir" type="button" class="btn btn-success w-100">

                    Prosseguir

                </button>

            </div>

            <!-- FOOTER -->
            <footer class="mt-5">

                <p class="text-center">
                    © 2026 PedidoZap. Todos os direitos reservados.
                </p>

            </footer>

        </div>

    </div>

    <script src="js/formulario.js"></script>
</body>
</html>
